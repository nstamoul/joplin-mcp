# Production Configuration (Wyze)
# Usage: docker compose -f docker-compose.yml -f docker-compose.wyze.yaml up -d
#
# This configuration is for production deployment on wyze:
# - Traefik reverse proxy integration
# - Basic Auth middleware via chain-authelia@file
# - SSL/TLS termination
# - External network (t2_proxy)
# - Internal port only (no host binding)

services:
  joplin-mcp-server:
    # Connect to Traefik network
    networks:
      - t2_proxy

    labels:
      # Enable Traefik
      - traefik.enable=true

      # Router: match host and path prefix
      - traefik.http.routers.joplin-mcp.rule=Host(`mcp.nstam.eu`) && PathPrefix(`/joplin`)
      - traefik.http.routers.joplin-mcp.entrypoints=https
      - traefik.http.routers.joplin-mcp.tls=true

      # Middleware: strip /joplin prefix
      - traefik.http.middlewares.joplin-strip.stripprefix.prefixes=/joplin

      # Apply middleware chain: auth + strip prefix
      - traefik.http.routers.joplin-mcp.middlewares=chain-authelia@file,joplin-strip@docker

      # Service configuration
      - traefik.http.services.joplin-mcp.loadbalancer.server.port=8006

networks:
  t2_proxy:
    name: t2_proxy
    external: true
