# Common Docker Compose Configuration
# Shared configuration for all environments
# Do not use this file directly - use docker-compose.local.yaml or docker-compose.wyze.yaml

services:
  joplin-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: joplin-mcp-server:latest
    container_name: joplin-mcp-server
    restart: unless-stopped

    env_file:
      - ../../.env  # Points to /opt/docker/mcp-proxy/.env

    environment:
      # Server mode
      NODE_ENV: production
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8006
      MCP_PATH: /mcp
      MCP_LOG_LEVEL: info

      # Joplin connection settings
      JOPLIN_API_TOKEN: ${JOPLIN_API_TOKEN:-}
      JOPLIN_BASE_URL: ${JOPLIN_BASE_URL:-http://localhost:41184}

      # Optional: Custom config file path
      # JOPLIN_MCP_CONFIG: /config/joplin-mcp.json

      # Debug mode
      MCP_DEBUG: ${MCP_DEBUG:-false}

    # Optional: Mount config file
    # volumes:
    #   - ./joplin-mcp.json:/config/joplin-mcp.json:ro

    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$${MCP_PORT:-8006}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
